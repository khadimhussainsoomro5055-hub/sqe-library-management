name: Java Tests, Coverage and SonarCloud

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'test/**']
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Compile, test and measure coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download JUnit and JaCoCo
        run: |
          mkdir -p lib coverage
          curl -fL -o lib/junit-platform-console-standalone.jar \
            https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar
          curl -fL -o lib/jacocoagent.jar \
            https://repo.maven.apache.org/maven2/org/jacoco/org.jacoco.agent/0.8.12/org.jacoco.agent-0.8.12-runtime.jar
          curl -fL -o lib/jacococli.jar \
            https://repo.maven.apache.org/maven2/org/jacoco/org.jacoco.cli/0.8.12/org.jacoco.cli-0.8.12-nodeps.jar
      - name: Compile application and tests
        run: |
          mkdir -p out
          javac -cp "lib/junit-platform-console-standalone.jar" \
            -d out src/main.java src/books_management/*.java tests/*.java
      - name: Run JUnit tests with JaCoCo instrumentation
        run: |
          java -javaagent:lib/jacocoagent.jar=destfile=coverage/jacoco.exec,includes=books,Member,LibraryIOError,CatalogWriter,main \
            -jar lib/junit-platform-console-standalone.jar execute \
            --class-path out --scan-class-path --details=summary
      - name: Generate HTML, XML and CSV coverage reports
        if: always()
        run: |
          if [ -f coverage/jacoco.exec ]; then
            java -jar lib/jacococli.jar report coverage/jacoco.exec \
              --classfiles out \
              --sourcefiles src \
              --html coverage/html \
              --xml coverage/jacoco.xml \
              --csv coverage/jacoco.csv
          else
            echo "JaCoCo execution data was not generated."
            exit 1
          fi
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab11-coverage-baseline
          path: |
            coverage/
            out/
            lib/junit-platform-console-standalone.jar
          if-no-files-found: error

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download JUnit 5 and compile
        run: |
          mkdir -p lib out
          curl -fL -o lib/junit-platform-console-standalone.jar \
            https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar
          javac -cp "lib/junit-platform-console-standalone.jar" \
            -d out src/main.java src/books_management/*.java tests/*.java
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
