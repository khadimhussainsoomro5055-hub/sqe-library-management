name: Java Tests and SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Compile and run JUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download JUnit 5
        run: |
          mkdir -p lib
          curl -fL -o lib/junit-platform-console-standalone.jar \
            https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar
      - name: Compile application and tests
        run: |
          mkdir -p out
          javac -cp "lib/junit-platform-console-standalone.jar" \
            -d out src/main.java src/books_management/*.java tests/*.java
      - name: Run JUnit tests
        run: |
          java -jar lib/junit-platform-console-standalone.jar execute \
            --class-path out --scan-class-path --details=summary
      - name: Upload test runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-runtime
          path: |
            out/
            lib/junit-platform-console-standalone.jar
          if-no-files-found: ignore

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download JUnit 5 and compile
        run: |
          mkdir -p lib out
          curl -fL -o lib/junit-platform-console-standalone.jar \
            https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar
          javac -cp "lib/junit-platform-console-standalone.jar" \
            -d out src/main.java src/books_management/*.java tests/*.java
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
