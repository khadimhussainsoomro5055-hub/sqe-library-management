name: Lab 12 API Tests

on:
  push:
    branches: [main, "feature/lab12-api-tests"]
    paths:
      - "libraryhub-api-java/**"
      - ".github/workflows/lab12-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "libraryhub-api-java/**"
      - ".github/workflows/lab12-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: Spring Boot and REST Assured
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraryhub-api-java
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run API integration tests
        run: mvn -B clean verify
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab12-junit-reports
          path: libraryhub-api-java/target/surefire-reports/
          if-no-files-found: warn
